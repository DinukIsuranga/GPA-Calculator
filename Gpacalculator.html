<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple GPA Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f7;
    color: #1c1c1e;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 480px;
    padding: 28px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 20px; }
  .course-row {
    display: grid;
    grid-template-columns: 1fr 80px 100px 36px;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }
  .course-row input, .course-row select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d1d6;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    background: #fff;
  }
  .course-row input:focus, .course-row select:focus { border-color: #1c1c1e; }
  .del-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: #8e8e93;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.2s, background 0.2s, color 0.2s;
  }
  .course-row:hover .del-btn, .course-row:focus-within .del-btn { opacity: 1; }
  .del-btn:hover { background: #ffebee; color: #c62828; }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border: 1px solid #d1d1d6;
    border-radius: 10px;
    background: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #f2f2f7; }
  .btn-primary {
    background: #1c1c1e;
    color: #fff;
    border-color: #1c1c1e;
  }
  .btn-primary:hover { background: #333; }
  .result {
    margin-top: 20px;
    padding: 20px;
    border-radius: 12px;
    background: #f2f2f7;
    text-align: center;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .result.show { opacity: 1; transform: translateY(0); }
  .result-label { font-size: 14px; color: #636366; margin-bottom: 4px; }
  .result-value { font-size: 40px; font-weight: 600; color: #1c1c1e; }
  .result-sub { font-size: 13px; color: #8e8e93; margin-top: 4px; }
  .empty { text-align: center; color: #c7c7cc; font-size: 14px; padding: 24px 0; }
</style>
</head>
<body>

<div class="card">
  <h1>GPA Calculator</h1>
  <div id="courses"></div>
  <div class="actions">
    <button class="btn" onclick="addCourse()">+ Add course</button>
    <button class="btn btn-primary" onclick="calculateGPA()">Calculate GPA</button>
  </div>
  <div id="result" class="result">
    <div class="result-label">Your GPA</div>
    <div class="result-value" id="gpaValue">0.00</div>
    <div class="result-sub" id="gpaDetail">0 credits</div>
  </div>
</div>

<script>
  const gradeMap = {
    'A': 4.0, 'A-': 3.7, 'B+': 3.3, 'B': 3.0, 'B-': 2.7,
    'C+': 2.3, 'C': 2.0, 'C-': 1.7, 'D+': 1.3, 'D': 1.0,
    'D-': 0.7, 'F': 0.0
  };
  const grades = Object.keys(gradeMap);
  let courseId = 0;

  function addCourse(name = '', credits = '', grade = 'A') {
    const container = document.getElementById('courses');
    const id = ++courseId;
    const row = document.createElement('div');
    row.className = 'course-row';
    row.dataset.id = id;
    row.innerHTML = `
      <input type="text" placeholder="Course name" value="${name}" data-field="name">
      <input type="number" placeholder="Credits" min="0" step="0.5" value="${credits}" data-field="credits">
      <select data-field="grade">
        ${grades.map(g => `<option value="${g}" ${g === grade ? 'selected' : ''}>${g}</option>`).join('')}
      </select>
      <button class="del-btn" onclick="removeCourse(${id})" title="Remove">&times;</button>
    `;
    container.appendChild(row);
    updateEmptyState();
  }

  function removeCourse(id) {
    const row = document.querySelector(`.course-row[data-id="${id}"]`);
    if (row) { row.remove(); updateEmptyState(); }
  }

  function updateEmptyState() {
    const container = document.getElementById('courses');
    const existing = container.querySelector('.empty');
    if (container.children.length === 0) {
      if (!existing) {
        const div = document.createElement('div');
        div.className = 'empty';
        div.textContent = 'No courses added yet';
        container.appendChild(div);
      }
    } else if (existing) {
      existing.remove();
    }
  }

  function calculateGPA() {
    const rows = document.querySelectorAll('.course-row');
    let totalPoints = 0, totalCredits = 0, valid = 0;
    rows.forEach(row => {
      const credits = parseFloat(row.querySelector('[data-field="credits"]').value);
      const grade = row.querySelector('[data-field="grade"]').value;
      if (!isNaN(credits) && credits > 0) {
        totalPoints += credits * gradeMap[grade];
        totalCredits += credits;
        valid++;
      }
    });
    const result = document.getElementById('result');
    const gpaValue = document.getElementById('gpaValue');
    const gpaDetail = document.getElementById('gpaDetail');
    if (valid === 0) {
      gpaValue.textContent = '—';
      gpaDetail.textContent = 'Add at least one course with credits';
    } else {
      const gpa = totalPoints / totalCredits;
      gpaValue.textContent = gpa.toFixed(2);
      gpaDetail.textContent = `${totalCredits} credit${totalCredits !== 1 ? 's' : ''} across ${valid} course${valid !== 1 ? 's' : ''}`;
    }
    result.classList.add('show');
  }

  updateEmptyState();
  addCourse('', '3', 'A');
  addCourse('', '3', 'B');
</script>

</body>
</html>
